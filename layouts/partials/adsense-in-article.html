{{- if and .Site.Params.googleAdsense.enabled .Site.Params.googleAdsense.inArticleAd -}}
<!-- In-Article Ad -->
<div class="adsense-container" style="margin: 2rem 0; text-align: center;">
    <ins class="adsbygoogle" style="display:block; text-align:center;" data-ad-layout="in-article"
        data-ad-format="fluid" data-ad-client="{{ .Site.Params.googleAdsense.publisherId }}"
        data-ad-slot="{{ .Site.Params.googleAdsense.adSlots.inArticle }}"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
{{- end -}}
